
name: Build Mehrineh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android project
        run: |
          cd flutter_shell
          flutter create --platforms=android .

      - name: Install dependencies
        run: |
          cd flutter_shell
          flutter pub get

      - name: Build APK
        run: |
          cd flutter_shell
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mehrineh-android-apk
          path: flutter_shell/build/app/outputs/flutter-apk/app-debug.apk

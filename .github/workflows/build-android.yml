name: Build Mehrineh Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: |
          cd flutter_shell
          flutter create --platforms=android .

      - name: Copy website into Android app
        run: |
          mkdir -p flutter_shell/assets/web
          cp -R website/. flutter_shell/assets/web/

          test -f flutter_shell/assets/web/app.html
          test -f flutter_shell/assets/web/js/app.js
          test -f flutter_shell/assets/web/css/app.css

      - name: Install dependencies
        run: |
          cd flutter_shell
          flutter pub get

      - name: Build APK
        run: |
          cd flutter_shell
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mehrineh-android-fixed
          path: flutter_shell/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
